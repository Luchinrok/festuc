<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <title>Imatge destacada · Festuc</title>
  <!-- Es fa la PNG amb: msedge --headless=new --window-size=1024,500 --screenshot=destacada.png destacada.html -->
  <style>
    html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
    body {
      font-family: "Segoe UI", Roboto, system-ui, sans-serif;
      background: linear-gradient(135deg, #8BC34A 0%, #639922 55%, #3B6D11 100%);
      position: relative;
    }
    .wrap { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 0 0 64px; gap: 24px; }
    .txt { flex: 1; color: #fff; }
    .logo { display: flex; align-items: center; gap: 18px; }
    .logo img { width: 96px; height: 96px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.25)); }
    .brand { font-weight: 800; font-size: 104px; line-height: 1; letter-spacing: -0.03em; }
    .tag { margin-top: 22px; font-weight: 700; font-size: 38px; line-height: 1.15; max-width: 470px; }
    .chips { display: flex; gap: 10px; margin-top: 26px; }
    .chip { padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 20px; color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
    .c1 { background: linear-gradient(135deg, #42A5F5, #1565C0); }
    .c2 { background: linear-gradient(135deg, #FFA726, #EF6C00); }
    .c3 { background: linear-gradient(135deg, #66BB6A, #2E7D32); border: 2px solid rgba(255,255,255,.6); }
    .phones { position: relative; width: 420px; height: 500px; }
    .phone { position: absolute; width: 206px; height: 366px; border: 7px solid #1A1A1A; border-radius: 30px; overflow: hidden; background: #FAFAF7; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
    .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .p1 { left: 10px; top: 92px; transform: rotate(-6deg); }
    .p2 { left: 190px; top: 46px; transform: rotate(5deg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="txt">
      <div class="logo"><img src="../icons/festuc-icon-any.svg" alt=""><div class="brand">Festuc</div></div>
      <div class="tag">Menja't el que tens abans que caduqui</div>
      <div class="chips"><span class="chip c1">Compra'm</span><span class="chip c2">Cuina'm</span><span class="chip c3">Menja'm</span></div>
    </div>
    <div class="phones">
      <div class="phone p1"><img src="captura-4.png" alt=""></div>
      <div class="phone p2"><img src="captura-2.png" alt=""></div>
    </div>
  </div>
</body>
</html>
